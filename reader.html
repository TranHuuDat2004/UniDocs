<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chế độ đọc sách - UniDocs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- Page Flip Lib -->
    <script src="https://unpkg.com/page-flip/dist/js/page-flip.browser.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background-color: #1a1a1a;
            color: #e2e8f0;
            margin: 0;
            overflow: hidden;
        }

        .reader-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .flip-book {
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.5);
            margin: auto;
            visibility: hidden; /* Hidden until loaded */
        }

        .page {
            background-color: white;
            overflow: hidden;
        }

        .page-content {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* Loading UI */
        .loader-overlay {
            position: fixed;
            inset: 0;
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.5s ease;
        }

        .progress-bar-container {
            width: 200px;
            height: 4px;
            background: #334155;
            border-radius: 2px;
            margin-top: 1rem;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: #6366f1;
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Controls */
        .controls {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(8px);
            padding: 0.75rem 1.5rem;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            gap: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 50;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .control-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.2s;
            cursor: pointer;
        }

        .control-btn:hover {
            background: rgba(99, 102, 241, 0.2);
            color: #818cf8;
        }

        .control-btn:active {
            transform: scale(0.9);
        }

        .exit-btn {
            position: fixed;
            top: 1.5rem;
            left: 1.5rem;
            z-index: 50;
        }

        /* Book wood texture background effect */
        .bg-pattern {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #2d3748 0%, #1a202c 100%);
            opacity: 0.6;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div class="bg-pattern"></div>

    <div class="reader-container">
        <!-- Exit -->
        <div class="exit-btn">
            <button onclick="closeReader();" class="flex items-center gap-2 px-4 py-2 bg-white/10 hover:bg-white/20 rounded-full text-white transition backdrop-blur-sm border border-white/10">
                <i class="ph ph-arrow-left"></i> Thoát
            </button>
        </div>

        <!-- Loader -->
        <div id="loader" class="loader-overlay">
            <div class="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-indigo-500/20 mb-6 animate-bounce">
                <i class="ph-fill ph-book-open text-3xl"></i>
            </div>
            <h2 class="text-xl font-bold text-white mb-2">Đang chuẩn bị sách...</h2>
            <p id="loadingStatus" class="text-slate-400 text-sm">Đang tải tài liệu</p>
            <div class="progress-bar-container">
                <div id="progressBar" class="progress-bar-fill"></div>
            </div>
        </div>

        <!-- Book -->
        <div class="flex-1 flex items-center justify-center p-4 md:p-10">
            <div id="bookContainer" class="flip-book">
                <!-- Pages will be injected here -->
            </div>
        </div>

        <!-- Controls -->
        <div class="controls transition-all duration-300 transform opacity-0 translate-y-10" id="uiControls">
            <button class="control-btn" id="prevBtn" title="Trang trước">
                <i class="ph-bold ph-caret-left text-xl"></i>
            </button>
            <div class="flex items-center gap-2 border-x border-white/10 px-4">
                <span id="currentPage" class="font-bold text-indigo-400">1</span>
                <span class="text-slate-500">/</span>
                <span id="totalPages" class="text-slate-300">?</span>
            </div>
            <button class="control-btn" id="nextBtn" title="Trang sau">
                <i class="ph-bold ph-caret-right text-xl"></i>
            </button>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let pageFlip = null;
        const bookContainer = document.getElementById('bookContainer');
        const progressBar = document.getElementById('progressBar');
        const loadingStatus = document.getElementById('loadingStatus');

        function closeReader() {
            const params = new URLSearchParams(window.location.search);
            const subjectId = params.get('id');

            if (window.opener || window.history.length > 1) {
                if (window.opener) {
                    window.close();
                } else {
                    window.history.back();
                }
            } else {
                // If subjectId exists, return to the subject page, otherwise home
                window.location.href = subjectId ? `subject.html?id=${subjectId}` : 'index.html';
            }
        }

        async function initReader() {
            const params = new URLSearchParams(window.location.search);
            const fileUrl = params.get('file');

            if (!fileUrl) {
                alert('Không tìm thấy file tài liệu!');
                closeReader();
                return;
            }

            try {
                // 1. Load PDF
                const loadingTask = pdfjsLib.getDocument(fileUrl);
                const pdf = await loadingTask.promise;
                const numPages = pdf.numPages;
                document.getElementById('totalPages').innerText = numPages;

                // 2. Render Pages to Canvases
                loadingStatus.innerText = `Đang xử lý ${numPages} trang...`;
                
                // We need to know the dimensions of the first page to set the book size
                const firstPage = await pdf.getPage(1);
                const baseViewport = firstPage.getViewport({ scale: 1.5 });
                const bookWidth = Math.round(baseViewport.width);
                const bookHeight = Math.round(baseViewport.height);

                for (let i = 1; i <= numPages; i++) {
                    const page = await pdf.getPage(i);
                    const viewport = page.getViewport({ scale: 1.5 }); // Balanced scale
                    
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    await page.render({ canvasContext: context, viewport: viewport }).promise;

                    const pageDiv = document.createElement('div');
                    pageDiv.className = 'page';
                    
                    // Cover pages use hard density
                    if (i === 1 || i === numPages) {
                        pageDiv.setAttribute('data-density', 'hard');
                    } else {
                        pageDiv.setAttribute('data-density', 'soft');
                    }
                    
                    const contentDiv = document.createElement('div');
                    contentDiv.className = 'page-content';
                    contentDiv.appendChild(canvas);
                    pageDiv.appendChild(contentDiv);
                    
                    bookContainer.appendChild(pageDiv);

                    // Update Progress
                    const progress = (i / numPages) * 100;
                    progressBar.style.width = `${progress}%`;
                    loadingStatus.innerText = `Đang tải trang ${i}/${numPages}`;
                }

                // 3. Initialize PageFlip
                initPageFlip(bookWidth, bookHeight);

                // 4. Show UI
                setTimeout(() => {
                    document.getElementById('loader').style.opacity = '0';
                    setTimeout(() => {
                        document.getElementById('loader').remove();
                        document.getElementById('uiControls').classList.remove('opacity-0', 'translate-y-10');
                        bookContainer.style.visibility = 'visible';
                    }, 500);
                }, 500);

            } catch (err) {
                console.error('Error loading PDF:', err);
                alert('Lỗi khi tải hoặc hiển thị tài liệu. Vui lòng thử lại!');
            }
        }

        function initPageFlip(width, height) {
            // Adjust width/height based on screen
            const isMobile = window.innerWidth < 768;
            
            pageFlip = new St.PageFlip(bookContainer, {
                width: width,
                height: height,
                size: "stretch",
                minWidth: 315,
                maxWidth: 1000,
                minHeight: 420,
                maxHeight: 1350,
                maxShadowOpacity: 0.5,
                showCover: true,
                mobileScrollSupport: false // set to false to prevent page scrolling on mobile devices
            });

            pageFlip.loadFromHTML(document.querySelectorAll('.page'));

            // Events
            document.getElementById('prevBtn').onclick = () => pageFlip.flipPrev();
            document.getElementById('nextBtn').onclick = () => pageFlip.flipNext();

            pageFlip.on('flip', (e) => {
                // Update current page (plus 1 because it's 0-indexed)
                document.getElementById('currentPage').innerText = e.data + 1;
            });
        }

        window.onload = initReader;
    </script>
</body>

</html>
